@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.9)}}
@keyframes point{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.br{animation:breathe 3.4s ease-in-out infinite}
.talk{transform-box:fill-box;transform-origin:center top;animation:talk .26s ease-in-out infinite}
.pt{transform-box:view-box;transform-origin:84px 64px;animation:point 2.6s ease-in-out infinite}
.bl{transform-box:fill-box;transform-origin:center;animation:blink 4.2s linear infinite}
@media (prefers-reduced-motion: reduce){.br,.pt,.bl{animation:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"who":{"editor":"enum","options":["blokbek","shox"],"default":"blokbek"},"size":{"editor":"int","min":40,"max":500,"default":160},"talking":{"editor":"boolean","default":true},"emotion":{"editor":"enum","options":["neutral","happy","thinking","listening"],"default":"happy"},"silhouette":{"editor":"boolean","default":false},"$preview":{"width":160,"height":290}}'>
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.size ?? 160) || 160;
    const who = this.props.who ?? 'blokbek';
    const talking = this.props.talking === undefined ? true : (this.props.talking === true || this.props.talking === 'true');
    const sil = this.props.silhouette === true || this.props.silhouette === 'true';
    const e = this.props.emotion ?? 'happy';
    const F = {
      neutral:   { browL: 23, browR: 21, pupL: 48, pupR: 64, pupH: 6, mX: 50, mY: 44, mW: 13, mH: 3, tX: 50, tW: 0,  tH: 0, smirk: 1 },
      happy:     { browL: 21, browR: 21, pupL: 48, pupR: 64, pupH: 6, mX: 47, mY: 42, mW: 20, mH: 8, tX: 48, tW: 18, tH: 3, smirk: 0 },
      thinking:  { browL: 23, browR: 17, pupL: 49, pupR: 65, pupH: 3, mX: 53, mY: 45, mW: 9,  mH: 3, tX: 53, tW: 0,  tH: 0, smirk: 0 },
      listening: { browL: 20, browR: 20, pupL: 46, pupR: 62, pupH: 6, mX: 54, mY: 43, mW: 6,  mH: 5, tX: 54, tW: 0,  tH: 0, smirk: 0 }
    }[e] || {};
    return Object.assign({
      w: w,
      h: Math.round(w * 236 / 130),
      isBlok: who !== 'shox',
      isShox: who === 'shox',
      mouthClass: talking ? 'talk' : '',
      filter: sil ? 'brightness(0) opacity(.45)' : 'none'
    }, F);
  }
}
</script>
