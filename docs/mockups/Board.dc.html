<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>To2 doska</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.draw{stroke-dasharray:400;animation:draw 1.4s ease-out both}
.glow{animation:glow 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.draw,.glow{animation:none}}
</style>
</helmet>
<div style="width: 100%; height: 100%; background: #233029; font-family: Kalam, 'Comic Sans MS', cursive; color: #f5f3ea">
<sc-if value="{{isQuad}}" hint-placeholder-val="{{ true }}">
<svg width="100%" height="100%" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Doska: x kvadrat minus 5x plus 6 teng 0 tenglamasini yechish" style="display: block; font-family: Kalam, 'Comic Sans MS', cursive; font-weight: 700">
<rect width="1000" height="625" fill="#233029"></rect>
<ellipse cx="240" cy="560" rx="200" ry="40" fill="#ffffff" opacity="0.03"></ellipse>
<ellipse cx="760" cy="90" rx="220" ry="50" fill="#ffffff" opacity="0.025"></ellipse>
<text x="150" y="130" font-size="66" fill="#f5f3ea">x<tspan font-size="40" dy="-28">2</tspan><tspan dy="28"> − 5x + 6 = 0</tspan></text>
<text x="150" y="250" font-size="62" fill="#f5f3ea">(x − 2)(x − 3) = 0</text>
<text x="150" y="365" font-size="54" fill="#f5f3ea">x − 2 = 0  <tspan font-size="40" fill="#cfd8cf">yoki</tspan>  x − 3 = 0</text>
<text x="190" y="490" font-size="66" fill="#ffd85c">x = 2   <tspan font-size="44">yoki</tspan>   x = 3</text>
<path class="draw" d="M180 525 q 60 10 120 0 t 120 0 t 120 0 t 120 0" stroke="#ffd85c" stroke-width="5" fill="none" stroke-linecap="round"></path>
<g opacity="{{tipOp}}"><circle class="glow" cx="688" cy="530" r="9" fill="#ffd85c"></circle></g>
<g opacity="{{noteOp}}">
<ellipse cx="380" cy="228" rx="255" ry="52" fill="none" stroke="#ff9f43" stroke-width="4" stroke-dasharray="14 8" opacity="0.9"></ellipse>
<path d="M650 150 C 700 160, 700 200, 640 214" stroke="#ff9f43" stroke-width="4" fill="none" stroke-linecap="round"></path>
<path d="M650 206 l -12 8 l 12 6" stroke="#ff9f43" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="690" y="80" font-size="30" fill="#ff9f43">ko'paytmasi 6:</text>
<text x="690" y="120" font-size="34" fill="#ff9f43">(−2)·(−3) = 6</text>
<text x="690" y="180" font-size="30" fill="#ff9f43">yig'indisi −5:</text>
<text x="690" y="220" font-size="34" fill="#ff9f43">(−2)+(−3) = −5</text>
</g>
</svg>
</sc-if>
<sc-if value="{{isFrac}}" hint-placeholder-val="{{ false }}">
<svg width="100%" height="100%" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Doska: bir ikkidan birga bir uchdan birni qo'shish, kasr chiziqlari bilan" style="display: block; font-family: Kalam, 'Comic Sans MS', cursive; font-weight: 700">
<rect width="1000" height="625" fill="#233029"></rect>
<g fill="#f5f3ea" font-size="52" text-anchor="middle">
<text x="90" y="92">1</text><text x="90" y="158">2</text>
<text x="160" y="128">+</text>
<text x="230" y="92">1</text><text x="230" y="158">3</text>
<text x="300" y="128">=</text>
<text x="352" y="132" fill="#ffd85c" font-size="60">?</text>
</g>
<g stroke="#f5f3ea" stroke-width="4" stroke-linecap="round">
<line x1="66" y1="108" x2="114" y2="108"></line>
<line x1="206" y1="108" x2="254" y2="108"></line>
</g>
<text x="60" y="250" fill="#ffd85c" font-size="44">EKUK (2; 3) = 6</text>
<g font-size="52" text-anchor="middle">
<text x="90" y="340" fill="#f5f3ea">1</text><text x="90" y="406" fill="#f5f3ea">2</text>
<text x="160" y="376" fill="#f5f3ea">=</text>
<text x="230" y="340" fill="#7cc7ff">3</text><text x="230" y="406" fill="#7cc7ff">6</text>
</g>
<g stroke-width="4" stroke-linecap="round">
<line x1="66" y1="356" x2="114" y2="356" stroke="#f5f3ea"></line>
<line x1="206" y1="356" x2="254" y2="356" stroke="#7cc7ff"></line>
</g>
<path class="draw" d="M292 372 l 14 16 l 30 -36" stroke="#8be28b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<g font-size="52" text-anchor="middle" fill="#f5f3ea">
<text x="90" y="470">1</text><text x="90" y="536">3</text>
<text x="160" y="506">=</text>
<text x="230" y="470" fill="#ffd85c">?</text><text x="230" y="536">6</text>
</g>
<g stroke="#f5f3ea" stroke-width="4" stroke-linecap="round">
<line x1="66" y1="486" x2="114" y2="486"></line>
<line x1="206" y1="486" x2="254" y2="486"></line>
</g>
<rect x="200" y="422" width="60" height="58" rx="6" fill="none" stroke="#ffd85c" stroke-width="3" stroke-dasharray="8 6"></rect>
<g font-size="26" fill="#f5f3ea" opacity="0.85"><text x="470" y="58">1/2</text><text x="470" y="158">1/3</text><text x="470" y="318">3/6</text></g>
<text x="470" y="438" font-size="26" fill="#ffd85c">?/6</text>
<rect x="470" y="70" width="235" height="54" fill="#7cc7ff" opacity="0.85"></rect>
<rect x="470" y="170" width="156.7" height="54" fill="#ff9bb0" opacity="0.85"></rect>
<rect x="470" y="330" width="235" height="54" fill="#7cc7ff" opacity="0.85"></rect>
<rect x="470" y="450" width="156.7" height="54" fill="#ff9bb0" opacity="0.25"></rect>
<g fill="none" stroke="#f5f3ea" stroke-width="4"><rect x="470" y="70" width="470" height="54"></rect><rect x="470" y="170" width="470" height="54"></rect><rect x="470" y="330" width="470" height="54"></rect><rect x="470" y="450" width="470" height="54"></rect></g>
<g stroke="#f5f3ea" stroke-width="3">
<line x1="705" y1="70" x2="705" y2="124"></line>
<line x1="626.7" y1="170" x2="626.7" y2="224"></line><line x1="783.3" y1="170" x2="783.3" y2="224"></line>
<line x1="548.3" y1="330" x2="548.3" y2="384"></line><line x1="626.7" y1="330" x2="626.7" y2="384"></line><line x1="705" y1="330" x2="705" y2="384"></line><line x1="783.3" y1="330" x2="783.3" y2="384"></line><line x1="861.7" y1="330" x2="861.7" y2="384"></line>
<line x1="548.3" y1="450" x2="548.3" y2="504"></line><line x1="626.7" y1="450" x2="626.7" y2="504"></line><line x1="705" y1="450" x2="705" y2="504"></line><line x1="783.3" y1="450" x2="783.3" y2="504"></line><line x1="861.7" y1="450" x2="861.7" y2="504"></line>
</g>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lesson":{"editor":"enum","options":["quad","frac"],"default":"quad"},"note":{"editor":"boolean","default":false},"$preview":{"width":1000,"height":625}}'>
class Component extends DCLogic {
  renderVals() {
    const l = this.props.lesson ?? 'quad';
    const note = this.props.note === true || this.props.note === 'true';
    return { isQuad: l !== 'frac', isFrac: l === 'frac', noteOp: note ? 1 : 0, tipOp: note ? 0 : 1 };
  }
}
</script>
</body>
</html>
