<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To2 — mobil ilova maketi v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563eb; --blue2:#3b82f6; --blue-d:#1d4ed8; --ink:#101735; --ink2:#5b6385; --line:#e6e9f5;
  --bg:#eef1fb; --card:#fff; --purple:#8b5cf6; --orange:#f59e0b; --green:#22c55e; --fire:#ff6a00;
  --r:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,ui-rounded,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;user-select:none;-webkit-user-drag:none}

/* ---------- page chrome ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:12px 20px;background:rgba(238,241,251,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:900;letter-spacing:-.2px}
.top h1 small{font-weight:700;color:var(--ink2);font-size:13px;margin-left:6px}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 2px 10px rgba(30,50,120,.08)}
.seg button{padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--blue);color:#fff}
.tchips{display:flex;gap:6px}
.tchips button{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;
  box-shadow:0 2px 10px rgba(30,50,120,.08);border:2px solid transparent}
.tchips button.on{border-color:var(--blue)}
.tchips img{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:top;background:#dbe6ff}

.grid{display:grid;grid-template-columns:repeat(4,var(--pw));gap:22px;justify-content:center;padding:26px 16px 60px;--pw:360px;--ph:740px}
@media (max-width:1560px){.grid{--sc:.86}}
@media (max-width:1300px){.grid{grid-template-columns:repeat(2,var(--pw))}}
@media (max-width:780px){.grid{grid-template-columns:var(--pw)}}
.cell{display:flex;flex-direction:column;gap:8px;align-items:center}
.cell .lab{font-weight:800;font-size:12px;color:var(--ink2);letter-spacing:.3px}
.phone{width:360px;height:740px;border-radius:38px;background:#fff;overflow:hidden;position:relative;
  box-shadow:0 18px 40px rgba(30,50,120,.16),0 0 0 1px rgba(30,50,120,.06)}
.phone.flash{animation:flash .9s ease}
@keyframes flash{0%,100%{box-shadow:0 18px 40px rgba(30,50,120,.16)}40%{box-shadow:0 0 0 6px var(--blue2),0 18px 40px rgba(30,50,120,.2)}}
.proto{display:none;justify-content:center;padding:26px 16px 60px}
body.p .grid{display:none} body.p .proto{display:flex}
.proto .phone{transform-origin:top center}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- shared bits ---------- */
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-weight:800;font-size:14px}
.status .ic{display:flex;gap:5px;align-items:center}
.status.lt{color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:999px;background:var(--blue);color:#fff;
  font-weight:900;font-size:18px;box-shadow:0 8px 18px rgba(37,99,235,.35);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)} .btn:hover{filter:brightness(1.06)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 10px 24px rgba(10,30,90,.25)}
.btn[disabled]{opacity:.45;pointer-events:none}
.circ{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(20,40,100,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:900;font-size:16px;box-shadow:0 4px 12px rgba(20,40,100,.08)}
.tab{height:66px;flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:#fff}
.tab button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:800;color:#8a90ab}
.tab button.on{color:var(--blue)}
.tab svg{width:22px;height:22px}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-4px) scaleY(1.012)}}

/* ---------- 1 splash ---------- */
.s1{background:linear-gradient(180deg,#5aa0ff 0%,#3d7cf2 48%,#2f5fd8 100%)}
.s1 .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.s1 .logo{position:relative;margin:28px auto 0;text-align:center}
.s1 .logo b{display:block;font-size:92px;font-weight:900;line-height:.95;color:#fff;letter-spacing:-3px;
  -webkit-text-stroke:3px #1f3fa8;paint-order:stroke fill;text-shadow:0 7px 0 #1f3fa8,0 12px 18px rgba(0,0,40,.25)}
.s1 .logo b i{font-style:normal;color:#c8e1ff}
.s1 .cap{position:absolute;left:4px;top:-22px;width:86px;transform:rotate(-14deg)}
.s1 .sub{color:#fff;font-weight:800;font-size:19px;line-height:1.25;text-align:center;margin-top:12px;text-shadow:0 2px 6px rgba(0,20,80,.25)}
.s1 .gem{position:absolute;width:38px;height:38px;background:linear-gradient(135deg,#7fb2ff,#2d5be3);transform:rotate(45deg);border-radius:8px;box-shadow:inset -6px -6px 0 rgba(0,0,60,.18)}
.s1 .sym{position:absolute;color:#fff;font-weight:900;text-shadow:0 4px 0 #2a52c9,0 6px 14px rgba(0,0,60,.3)}
.s1 .hill{position:absolute;left:-20px;right:-20px;bottom:-30px;height:230px;
  background:repeating-linear-gradient(90deg,#4caf50 0 26px,#43a047 26px 52px);border-radius:50% 50% 0 0/40px 40px 0 0;
  box-shadow:inset 0 14px 0 #66c26a}
.s1 .hero{position:absolute;left:calc(50% - 165px);bottom:92px;height:390px;width:330px;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 18px 18px rgba(0,20,70,.35))}
.s1 .go{position:absolute;left:44px;right:44px;bottom:34px}

/* ---------- 2 home ---------- */
.s2{background:linear-gradient(180deg,#eaf1ff 0%,#f6f8ff 40%,#fff 100%)}
.s2 .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 22px 0}
.av{width:44px;height:44px;border-radius:50%;background:#dbe6ff;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 12px rgba(20,40,100,.14)}
.av img{width:100%;height:100%;object-fit:cover;object-position:top}
.s2 .hello{position:relative;padding:14px 22px 0;height:118px}
.s2 .hello h2{font-size:36px;font-weight:900;line-height:1.05;letter-spacing:-.5px}
.s2 .hello img{position:absolute;right:6px;top:-12px;height:162px;width:170px;object-fit:contain;object-position:100% 0;filter:drop-shadow(0 10px 10px rgba(20,40,100,.2))}
.lesson{margin:8px 18px 0;border-radius:24px;padding:18px;background:linear-gradient(135deg,#dbe8ff,#c9dbff);position:relative;overflow:hidden;min-height:128px}
.lesson small{font-weight:700;color:var(--ink2);font-size:13px}
.lesson h3{font-size:20px;font-weight:900;line-height:1.15;margin:3px 0 12px}
.lesson .btn{height:38px;font-size:14px;padding:0 16px;display:inline-flex;box-shadow:0 6px 12px rgba(37,99,235,.3)}
.book{position:absolute;right:16px;top:24px;width:86px;height:100px;transform:rotate(12deg)}
.book .f{position:absolute;inset:0;border-radius:6px 10px 10px 6px;background:linear-gradient(135deg,#4f8dff,#2753d6);box-shadow:inset 8px 0 0 #1e3fb0,6px 8px 0 #193796}
.book .f::after{content:"x²+ =";position:absolute;inset:18px 10px auto 22px;color:#cfe0ff;font-weight:900;font-size:15px;letter-spacing:1px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 10px}
.sec h4{font-size:19px;font-weight:900}
.sec a{font-weight:800;font-size:13px;color:var(--ink2);display:flex;gap:4px;align-items:center}
.subj{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px}
.subj button{height:76px;border-radius:16px;color:#fff;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 6px 0 rgba(0,0,0,.12),0 8px 16px rgba(20,40,100,.12);transition:transform .12s}
.subj button:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.subj b{font-size:24px;font-weight:900;line-height:1}
.streak{margin:14px 18px 0;background:#fff;border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(20,40,100,.08)}
.streak .bars{margin-left:auto;display:flex;align-items:flex-end;gap:4px;height:30px}
.streak .bars i{width:7px;border-radius:3px;background:#fde68a}
.streak .bars i.on{background:#22c55e}

/* ---------- 3 roadmap ---------- */
.s3{background:linear-gradient(180deg,#4f8ff7 0%,#77b0ff 45%,#a9d0ff 100%)}
.s3 .hd{display:flex;align-items:center;gap:12px;padding:0 20px;color:#fff}
.s3 .hd h2{font-size:24px;font-weight:900;flex:1}
.s3 .cl{position:absolute;background:#fff;border-radius:999px;opacity:.75}
.isl{position:relative;margin:4px -14px 0;flex:none}
.isl>img{width:100%;filter:drop-shadow(0 22px 22px rgba(0,30,90,.28))}
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-70%);width:40px;height:40px;font-size:16px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;
  background:#e7ebf7;color:#6b7393;border:4px solid #fff;box-shadow:0 6px 0 #9aa3c3,0 10px 16px rgba(0,30,90,.3)}
.node.done{background:#22c55e;color:#fff;box-shadow:0 6px 0 #138a3f,0 10px 16px rgba(0,30,90,.3)}
.node.cur{width:52px;height:52px;background:var(--blue);color:#fff;box-shadow:0 7px 0 #1a3fb5,0 0 0 8px rgba(255,255,255,.45),0 12px 20px rgba(0,30,90,.35);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 7px 0 #1a3fb5,0 0 0 14px rgba(255,255,255,.18),0 12px 20px rgba(0,30,90,.35)}}
.node.goal{background:#fbbf24;color:#fff;box-shadow:0 6px 0 #c07d08,0 10px 16px rgba(0,30,90,.3)}
.node .lk{font-size:11px;margin-top:-6px}
.node.lock{flex-direction:column;line-height:1}
.unit{position:absolute;left:16px;right:16px;bottom:22px;background:#fff;border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 24px rgba(0,30,90,.2)}
.unit .ub{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#4f8dff,#2753d6);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:inset -4px -4px 0 rgba(0,0,0,.15)}
.unit h3{font-size:16px;font-weight:900} .unit p{font-size:12.5px;color:var(--ink2);font-weight:700}

/* ---------- 4 lesson ---------- */
.s4{background:linear-gradient(180deg,#f1f4ff,#e8eeff)}
.stage{position:relative;height:388px;overflow:hidden;flex:none}
.stage .room{position:absolute;left:0;top:-38px;width:100%;animation:kb 18s ease-in-out infinite alternate;transform-origin:30% 60%}
@keyframes kb{to{transform:scale(1.05) translate(-6px,-4px)}}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 45% 40%,transparent 55%,rgba(20,10,0,.35))}
.stage .tutor{position:absolute;left:-6px;top:52px;height:196px;width:170px;object-fit:contain;object-position:0 100%;filter:drop-shadow(0 8px 6px rgba(40,20,0,.25));transform-origin:50% 100%}
.chalk text{text-shadow:0 0 6px rgba(255,255,240,.35)}
@keyframes talkbob{50%{transform:translateY(-2px) rotate(-.6deg)}}
.stage .tl{z-index:2;position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between}
.chalk{position:absolute;left:132px;top:86px;width:218px;height:136px;z-index:1}
.chalk text{font-family:Caveat,cursive;font-weight:700;fill:#f4f7f2;font-size:23px;filter:url(#rough)}
.say{position:relative;margin:-58px 16px 0;background:#fff;border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 26px rgba(20,40,100,.16);z-index:2}
.say .sp{flex:none;width:38px;height:38px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.say p{font-weight:800;font-size:15px;line-height:1.35;min-height:42px}
.prog{display:flex;align-items:center;gap:12px;padding:20px 26px 0;font-weight:900;color:var(--ink2);font-size:14px}
.prog .tr{flex:1;height:8px;border-radius:9px;background:#dfe5f7;overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--blue2);border-radius:9px;transition:width .5s}
.mic{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:auto;padding-bottom:40px;position:relative}
.mic .m{width:92px;height:92px;border-radius:50%;background:linear-gradient(180deg,#3b82f6,#1d4ed8);display:grid;place-items:center;
  box-shadow:0 10px 22px rgba(37,99,235,.45),0 0 0 10px rgba(59,130,246,.14)}
.mic .m.rec{animation:rec 1s ease-in-out infinite}
@keyframes rec{50%{box-shadow:0 10px 22px rgba(37,99,235,.45),0 0 0 20px rgba(59,130,246,.08)}}
.mic .sk{position:absolute;right:30px;width:54px;height:54px;border-radius:50%;background:#e3eaff;display:grid;place-items:center}
.mic .hint{position:absolute;bottom:12px;font-size:12px;font-weight:800;color:var(--ink2)}

/* ---------- 5 quiz ---------- */
.s5{background:#fff}
.qh{display:flex;align-items:center;gap:14px;padding:8px 22px}
.qh .tr{flex:1;height:10px;border-radius:9px;background:#e6eaf7;overflow:hidden}
.qh .tr i{display:block;height:100%;width:60%;background:var(--blue2);border-radius:9px}
.qh b{font-weight:900;color:var(--ink2)}
.q{padding:22px 24px 6px}
.q h3{font-size:20px;font-weight:900;line-height:1.25}
.q .eq{font-size:26px;font-weight:900;text-align:center;margin:18px 0 10px;font-family:"Times New Roman",serif;font-style:italic}
.opts{display:flex;flex-direction:column;gap:12px;padding:6px 18px}
.opt{display:flex;align-items:center;gap:14px;height:56px;border-radius:999px;background:#f3f5fc;padding:0 10px;font-weight:800;font-size:17px;border:2px solid transparent;transition:all .15s;text-align:left}
.opt .k{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;color:var(--ink2);box-shadow:0 2px 6px rgba(20,40,100,.08)}
.opt .ck{margin-left:auto;width:28px;height:28px;border-radius:50%;display:none;place-items:center}
.opt.sel{background:#eaf1ff;border-color:var(--blue2)} .opt.sel .k{background:var(--blue);color:#fff} .opt.sel .ck{display:grid;background:var(--blue)}
.opt.ok{background:#e9fbef;border-color:#22c55e} .opt.ok .k{background:#22c55e;color:#fff} .opt.ok .ck{display:grid;background:#22c55e}
.opt.no{background:#fff0f0;border-color:#f87171;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin:12px 150px 0 18px;padding:12px 14px;border-radius:16px;font-weight:800;font-size:14px;display:none;align-items:center;gap:10px}
.fb.on{display:flex} .fb.good{background:#e9fbef;color:#137a3a} .fb.bad{background:#fff3e6;color:#9a4a00}
.fb img{width:40px;height:40px;object-fit:cover;object-position:top;border-radius:50%;background:#fff}
.s5 .foot{margin-top:auto;padding:0 22px 34px;position:relative;z-index:2}
.thinker{position:absolute;right:8px;bottom:98px;width:130px;height:140px;pointer-events:none}
.thinker img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;transition:opacity .35s;animation:sway 3.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) translateY(-3px)}}
.thinker .b2{opacity:0}
.thinker.alt .b1{opacity:0}.thinker.alt .b2{opacity:1}
.thinker .q{position:absolute;font-weight:900;color:var(--blue2);font-size:22px;animation:qf 2.4s ease-in-out infinite;opacity:0}
@keyframes qf{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.1)}}
.thinker .cloud{position:absolute;left:-62px;top:4px;background:#fff;border-radius:20px;padding:6px 12px;font-weight:900;font-size:15px;color:var(--ink2);box-shadow:0 6px 16px rgba(20,40,100,.14);animation:float 3s ease-in-out infinite}
.thinker .cloud::after{content:"";position:absolute;right:16px;bottom:-9px;width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:6px 8px 0 -2px #fff}
.thinker.happy img{animation:hop .5s ease-in-out 3}
@keyframes hop{50%{transform:translateY(-16px)}}
.thinker.happy .q,.thinker.happy .cloud{display:none}

/* ---------- 6 success ---------- */
.s6{background:radial-gradient(120% 70% at 50% 18%,#6d79d8 0%,#4b55b8 45%,#353d93 100%)}
.s6 .st{position:absolute;font-size:30px;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.25) rotate(12deg);opacity:.7}}
.s6 .hero{position:absolute;left:calc(50% - 165px);top:64px;height:310px;width:330px;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 18px 16px rgba(0,0,40,.35))}
.s6 .card{position:absolute;left:18px;right:18px;bottom:22px;background:#fff;border-radius:30px;padding:26px 22px 22px;text-align:center;box-shadow:0 18px 40px rgba(0,0,40,.35)}
.s6 h2{font-size:34px;font-weight:900;letter-spacing:-.5px}
.s6 p{font-weight:700;font-size:17px;color:#3c4466;margin:6px 0 18px;line-height:1.35}
.s6 .xp{display:inline-flex;gap:8px;margin-bottom:16px}
.s6 .xp span{background:#f1f4ff;border-radius:999px;padding:6px 12px;font-weight:900;font-size:13px}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(780px) rotate(540deg)}}

/* ---------- 7 progress ---------- */
.s7{background:linear-gradient(180deg,#f4f6ff,#fff)}
.s7 .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 24px 0}
.s7 h2{font-size:28px;font-weight:900}
.pills{display:flex;gap:8px;padding:16px 22px 4px}
.pills button{flex:1;height:40px;border-radius:999px;background:#fff;font-weight:800;color:var(--ink2);box-shadow:0 2px 8px rgba(20,40,100,.08)}
.pills button.on{background:var(--blue);color:#fff}
.chart{position:relative;margin:6px 10px 0;height:170px}
.chart svg{width:100%;height:100%}
.chart .tag{position:absolute;right:16px;top:6px;background:var(--blue);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:4px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 18px}
.stats div{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 4px 16px rgba(20,40,100,.08)}
.stats .e{font-size:26px} .stats b{display:block;font-size:24px;font-weight:900} .stats small{font-size:11.5px;font-weight:700;color:var(--ink2)}
.topics{padding:14px 22px 0}
.topics .r{display:flex;justify-content:space-between;font-weight:900;font-size:15px;margin-bottom:10px}
.topics .tr{height:12px;border-radius:9px;background:#e6eaf7;overflow:hidden}
.topics .tr i{display:block;height:100%;width:30%;background:var(--blue2);border-radius:9px}
.weak{margin:16px 18px 0;background:#fff7ed;border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:800;font-size:13.5px;color:#7c3e00}

/* ---------- 8 heroes ---------- */
.s8{background:linear-gradient(180deg,#f3f6ff,#e9efff)}
.s8 .hd{display:flex;align-items:center;justify-content:center;position:relative;padding:4px 20px}
.s8 .hd h2{font-size:20px;font-weight:900}
.s8 .hd .bk{position:absolute;left:16px}
.big{position:relative;margin:18px 50px 0;height:330px;border-radius:26px;background:linear-gradient(180deg,#6aa6ff,#2f6be8);overflow:hidden;
  box-shadow:0 14px 30px rgba(37,99,235,.35)}
.big .spark{position:absolute;color:#cfe2ff;font-size:16px}

  <p class="desc">${T.style}</p>
  <div class="thumbs">${TUTORS.map(t=>`<button class="${t.id===T.id?'on':''}" data-pick="${t.id}"><img src="${I(t.id+'_idle_face')}" alt="${t.name}"></button>`).join("")}
    ${LOCKED.map(t=>`<button class="lk" title="${t.name} — tez orada"><img src="${I(t.id+'_sig_face')}" alt="${t.name}"><span class="lt">🔒 Tez orada</span></button>`).join("")}</div>
  <div class="foot"><button class="btn" data-go="s2" style="width:100%">Tanlangan ✓</button></div>
</div>`;

const ORDER = ["s1","s2","s3","s4","s5","s6","s7","s8"];
const LABELS = {s1:"1 · Splash",s2:"2 · Bosh sahifa",s3:"3 · Yo'l xaritasi",s4:"4 · Dars",s5:"5 · Test",s6:"6 · Ajoyib!",s7:"7 · Progress",s8:"8 · Qahramonlar"};
let uid = 0, mode = "grid", cur = "s1";

function mount(el, id){
  uid++; el.innerHTML = S[id](); el.dataset.s = id;
  if(id==="s4") lessonInit(el);
}
function renderAll(){
  document.getElementById("tchips").innerHTML = TUTORS.map(t=>`<button class="${t.id===T.id?'on':''}" data-pick="${t.id}"><img src="${I(t.id+'_idle_face')}" alt="">${t.name}</button>`).join("");
  if(mode==="grid"){
    const g = document.getElementById("grid");
    if(!g.children.length) g.innerHTML = ORDER.map(id=>`<div class="cell"><div class="phone" id="ph-${id}"></div><span class="lab">${LABELS[id]}</span></div>`).join("");
    ORDER.forEach(id=>mount(document.getElementById("ph-"+id), id));
  } else mount(document.getElementById("pphone"), cur);
}

/* lesson: chalk writes line by line, the bubble follows, the tutor bobs while "talking" */
setInterval(()=>document.querySelectorAll(".thinker:not(.happy)").forEach(t=>t.classList.toggle("alt")), 2300);
function lessonInit(el){
  let step = 0, timers = [];
  const svg = el.querySelector(".chalk"), tut = el.querySelector(".room"), say = el.querySelector(".sayt"), pc = el.querySelector(".pc"), bar = el.querySelector(".prog i");
  const play = (i) => {
    say.textContent = LINES[i].t; pc.textContent = `${i+1} / 7`; bar.style.width = `${((i+1)/7)*100}%`;
    tut.classList.add("talk");
    const r = svg.querySelectorAll("clipPath rect")[i]; const t0 = performance.now();
    const tick = (now) => { const p = Math.max(0, Math.min(1,(now-t0)/1500)); r.setAttribute("width", 224*p); if(p<1) timers.push(requestAnimationFrame(tick)); else tut.classList.remove("talk"); };
    timers.push(requestAnimationFrame(tick));
  };
  const reset = () => { svg.querySelectorAll("clipPath rect").forEach(r=>r.setAttribute("width",0)); step=0; };
  const next = () => { if(step>=LINES.length){ reset(); } play(step); step++; };
  el.querySelector("[data-step]").onclick = (e)=>{ e.stopPropagation(); if(step>=LINES.length && mode==="proto"){ go("s5"); return; } next(); };
  const m = el.querySelector(".m");
  m.onpointerdown = ()=>{ m.classList.add("rec"); say.textContent="Tinglayapman… (savolingizni ayting)"; };
  m.onpointerup = m.onpointerleave = ()=>{ if(!m.classList.contains("rec")) return; m.classList.remove("rec"); say.textContent="Yaxshi savol! Ko'paytmasi 6 bo'lgan juftlar: 1·6 va 2·3. Yig'indisi 5 — faqat 2 va 3."; };
  setTimeout(next, 500);
  const auto = setInterval(()=>{ if(!document.body.contains(el) || el.dataset.s!=="s4"){ clearInterval(auto); return; } if(step<LINES.length) next(); }, 4200);
}

function go(id){
  if(mode==="proto"){ cur = id; mount(document.getElementById("pphone"), id); fit(); }
  else { const ph = document.getElementById("ph-"+id); ph.scrollIntoView({behavior:"smooth",block:"center"}); ph.classList.remove("flash"); void ph.offsetWidth; ph.classList.add("flash"); }
}
function pick(id){ T = TUTORS.find(t=>t.id===id) || T; try{ localStorage.setItem("to2.tutor", T.id); }catch(e){} renderAll(); }

document.addEventListener("click", e=>{
  const b = e.target.closest("button,a"); if(!b) return;
  if(b.dataset.mode){ mode = b.dataset.mode; document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on", x===b)); document.body.classList.toggle("p", mode==="proto"); renderAll(); fit(); return; }
  if(b.dataset.pick){ pick(b.dataset.pick); return; }
  if(b.dataset.cyc){ const i = TUTORS.indexOf(T); pick(TUTORS[(i+ +b.dataset.cyc + TUTORS.length)%TUTORS.length].id); return; }
  if(b.dataset.pill!==undefined){ b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); return; }
  const scr = b.closest(".scr");
  if(b.dataset.opt!==undefined){ scr.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel","no","ok")); b.classList.add("sel"); scr.querySelector("[data-confirm]").disabled=false; scr.querySelector(".fb").className="fb"; return; }
  if(b.dataset.confirm!==undefined){
    const sel = scr.querySelector(".opt.sel"); if(!sel) return; const fb = scr.querySelector(".fb"), ft = scr.querySelector(".fbt");
    const th = scr.querySelector(".thinker");
    if(sel.dataset.opt==="1"){ th.classList.add("happy"); th.querySelector(".b1").src=I(T.id+"_cheer_half"); th.classList.remove("alt"); sel.classList.add("ok"); fb.className="fb on good"; ft.textContent=`Barakalla! (−1)·5 = −5 va −1 + 5 = 4. ${T.name} xursand!`; b.textContent="Davom etish →"; b.dataset.confirm="done"; b.onclick=()=>go("s6"); }
    else { sel.classList.add("no"); fb.className="fb on bad"; ft.textContent="Deyarli! Tekshir: ildizlar ko'paytmasi −5, yig'indisi 4 bo'lishi kerak."; }
    return;
  }
  if(b.dataset.go){ go(b.dataset.go); }
});
function fit(){
  const ph = document.getElementById("pphone"); if(mode!=="proto") return;
  const s = Math.min(1, (innerHeight-110)/740); ph.style.transform = `scale(${s})`; ph.parentElement.style.height = (740*s+60)+"px";
}
addEventListener("resize", fit);
renderAll();
</script>
</body>
</html>
