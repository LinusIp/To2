<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To2 — doska prototipi: ustoz qo'lda yozadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#1b1713; color:#f3ede2;
         font: 500 16px/1.45 "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px 12px; }
  .stage { width:min(1400px,100%); position:relative; border-radius:14px; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,.5); }
  svg#scene { display:block; width:100%; height:auto; }
  .bar { width:min(1400px,100%); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:18px; padding:18px 4px 6px; }
  .who { display:flex; align-items:center; gap:10px; }
  .ava { width:40px; height:40px; border-radius:10px; background:var(--skin,#c98b5e); position:relative; overflow:hidden; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); }
  .ava::before { content:""; position:absolute; left:0; right:0; top:0; height:12px; background:var(--hair,#2b1d14); }
  .ava::after { content:""; position:absolute; left:9px; top:18px; width:6px; height:6px; background:#17181d; box-shadow:16px 0 0 #17181d, 7px 11px 0 2px #5a2318; }
  .name { font-size:13px; font-weight:800; letter-spacing:.6px; color:#f2b84b; }
  .state { font-size:12px; font-weight:600; color:#b5ab9b; }
  #cap { min-height:56px; display:flex; align-items:center; font-size:22px; font-weight:700; line-height:1.3; transition:opacity .2s; }
  .right { display:flex; align-items:center; gap:6px; }
  #me { display:none; font-size:15px; font-weight:700; color:#1b1713; background:#f3ede2; border-radius:16px 16px 4px 16px; padding:9px 14px; margin-right:6px; }
  button { font:inherit; border:0; cursor:pointer; }
  .ghost { width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:#d9d0c1; background:#2a241e; border-radius:12px; font-size:13px; font-weight:800; }
  .ghost:hover { background:#3a3229; color:#fff; }
  .ghost[aria-pressed="true"] { color:#1b1713; background:#f3ede2; }
  .ask { display:flex; align-items:center; gap:10px; height:52px; padding:0 22px 0 18px; margin-left:6px; border-radius:26px;
         background:#f2b84b; color:#241a08; font-weight:800; font-size:16px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  .ask:hover { background:#ffc65e; }
  .ask[disabled] { opacity:.4; cursor:default; }
  .steps { width:min(1400px,100%); display:flex; align-items:center; gap:14px; padding:8px 4px 0; }
  .segs { display:flex; gap:6px; }
  .seg { width:46px; height:6px; border-radius:3px; background:#3a3229; transition:background .3s; }
  .seg.done { background:#2fb6c4; }
  .seg.now { background:#f2b84b; }
  #stepLbl { font-size:14px; font-weight:700; color:#b5ab9b; }
  .sel { position:absolute; inset:0; pointer-events:none; }
  .sel[hidden] { display:none; }
  .selTitle { position:absolute; left:29%; top:12.2%; font: 700 clamp(18px,2.6vw,38px)/1 Kalam, "Comic Sans MS", cursive; color:#f3f0e6; opacity:.92; letter-spacing:.5px; }
  .grid { position:absolute; left:29%; top:20.5%; width:63.4%; height:65%; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(0,1fr)); gap:2.2%; pointer-events:auto; }
  .card { position:relative; border:2px dashed rgba(243,240,230,.38); border-radius:12px; background:rgba(255,255,255,.035); padding:0; cursor:pointer; overflow:hidden; display:flex; align-items:flex-end; transition:border-color .2s, background .2s, transform .15s; }
  .card:hover { border-color:rgba(243,240,230,.7); background:rgba(255,255,255,.06); }
  .card:focus-visible { outline:3px solid #f2b84b; outline-offset:2px; }
  .card.on { border:3px solid #f2c94c; background:rgba(242,201,76,.08); box-shadow:0 0 0 4px rgba(242,201,76,.15); }
  .lbl { width:100%; display:flex; flex-direction:column; align-items:center; gap:1px; padding:6% 4% 7%; background:linear-gradient(to top, rgba(22,32,27,.96) 60%, rgba(22,32,27,0)); color:#f3ede2; text-align:center; }
  .lbl b { font-size:clamp(11px,1.35vw,19px); font-weight:800; }
  .lbl i { font-style:normal; font-size:clamp(9px,.95vw,13px); font-weight:600; color:#c8c0b2; display:flex; align-items:center; gap:4px; }
  .card.locked .lbl b { color:#b5ab9b; }
  .chk { position:absolute; top:6%; right:6%; width:24px; height:24px; border-radius:50%; background:#f2c94c; display:none; align-items:center; justify-content:center; }
  .card.on .chk { display:flex; }
  .selInfo { display:flex; flex-direction:column; margin-right:8px; text-align:right; }
  .selInfo b { font-size:16px; } .selInfo span { font-size:12px; color:#b5ab9b; font-weight:600; }
  .ghost.wide { width:auto; padding:0 14px; gap:8px; }
  body[data-screen="select"] .les-only { display:none !important; }
  body[data-screen="lesson"] .sel-only { display:none !important; }
  @media (max-width:760px){ .bar{ grid-template-columns:1fr; } #cap{ font-size:18px; } }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 1600 900" role="img" aria-label="Sinfxona: ustoz Blokbek doskada x kvadrat minus 5x plus 6 teng nol tenglamasini qo'lda yechmoqda">

    <linearGradient id="plaster" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3e8d3" stop-opacity=".0"/><stop offset="1" stop-color="#b9a582" stop-opacity=".35"/></linearGradient>

  </defs>

  <g filter="url(#soft)">
  <!-- room -->
  <rect width="1600" height="900" fill="#e6dac3"/>
  <rect width="1600" height="900" fill="url(#plaster)"/>
  <!-- Samarkand-blue wainscot + tile frieze -->
  <rect x="0" y="606" width="1600" height="250" fill="#1d4a73"/>

  <rect x="0" y="576" width="1600" height="3" fill="#c9973f"/><rect x="0" y="606" width="1600" height="3" fill="#c9973f"/>
  <!-- floor -->
  <rect x="0" y="856" width="1600" height="44" fill="#8a5a35"/>
  <rect x="0" y="852" width="1600" height="6" fill="#5e3b20"/>
  <g fill="#74492a"><rect x="0" y="876" width="1600" height="2"/><rect x="210" y="858" width="2" height="18"/><rect x="620" y="878" width="2" height="22"/><rect x="1010" y="858" width="2" height="18"/><rect x="1380" y="878" width="2" height="22"/></g>
  <!-- window (wood) -->
  <rect x="40" y="92" width="300" height="338" fill="#7a4f2c"/>
  <rect x="54" y="106" width="272" height="310" fill="#a8d8f2"/>
  <rect x="54" y="300" width="272" height="116" fill="#cbe9f8"/>
  <g fill="#fff"><rect x="86" y="150" width="64" height="14"/><rect x="100" y="138" width="34" height="14"/><rect x="226" y="196" width="70" height="12"/></g>
  <rect x="54" y="352" width="272" height="64" fill="#7ab24f"/>
  <g fill="#5f9a3f"><rect x="150" y="214" width="44" height="44"/><rect x="194" y="200" width="44" height="44"/><rect x="236" y="222" width="40" height="40"/><rect x="170" y="252" width="44" height="40"/></g>
  <rect x="204" y="280" width="20" height="74" fill="#6b4421"/>
  <rect x="186" y="106" width="8" height="310" fill="#7a4f2c"/><rect x="54" y="254" width="272" height="8" fill="#7a4f2c"/>
  <rect x="28" y="428" width="324" height="16" fill="#6a4326"/><rect x="28" y="428" width="324" height="4" fill="#8c6038"/>
  <polygon points="54,416 326,416 820,856 330,856" fill="#fff3d6" opacity=".22"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <!-- plants -->
  <rect x="1528" y="786" width="58" height="70" fill="#b5653a"/><rect x="1528" y="786" width="58" height="8" fill="#c97a4c"/>
  <g fill="#4f8f36"><rect x="1534" y="722" width="16" height="64"/><rect x="1552" y="696" width="16" height="90"/><rect x="1570" y="734" width="14" height="52"/></g>
  <rect x="58" y="790" width="54" height="66" fill="#2fa3b0"/><rect x="58" y="790" width="54" height="8" fill="#47bcc8"/>
  <g fill="#4f8f36"><rect x="64" y="740" width="14" height="50"/><rect x="80" y="716" width="14" height="74"/><rect x="96" y="746" width="12" height="44"/></g>
  </g>
  <!-- board drop shadow -->
  <rect x="408" y="94" width="1150" height="740" fill="#000" opacity=".16"/>

  <!-- board: content uses a 1000x625 coordinate system -->
  <g id="boardG" transform="translate(420,100) scale(1.104)">
    <rect x="-18" y="-18" width="1036" height="661" fill="#7a4f2c"/>
    <rect x="-18" y="-18" width="1036" height="6" fill="#86603d"/>
    <rect x="0" y="0" width="1000" height="625" fill="#253a30"/>
    <ellipse cx="300" cy="300" rx="380" ry="200" fill="url(#smudge)"/>

    <rect x="222" y="636" width="30" height="8" fill="#f2c94c"/>
    <rect x="880" y="628" width="70" height="16" fill="#3a3f4a"/><rect x="880" y="628" width="70" height="6" fill="#c9b79a"/>

  <!-- tutor is rendered in 3D (canvas#gl) -->
  <ellipse id="shadow" cx="280" cy="860" rx="120" ry="13" fill="#000" opacity=".3"/>

</svg>
<canvas id="gl" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none"></canvas>
<div id="sel" class="sel">
  <div class="selTitle">Ustozingni tanla</div>
  <div class="grid" id="grid" role="group" aria-label="Ustozlar"></div>
</div>
</div>

<div class="bar">
  <div class="who"><div class="ava" aria-hidden="true"></div><div><div class="name" id="whoName">BLOKBEK</div><div class="state" id="state">gapirmoqda</div></div></div>
  <div id="cap" aria-live="polite"></div>
  <div class="right">
    <span id="me"></span>
    <div class="selInfo sel-only"><b id="selName">Blokbek</b><span id="selTag">Matematika ustasi</span></div>
    <button class="ghost wide sel-only" id="hear" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>Ovozini eshit</button>
    <button class="ask sel-only" id="start" type="button">Darsni boshlash<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="ghost wide les-only" id="tutors" type="button">Ustozlar</button>
    <button class="ghost les-only" id="replay" type="button" aria-label="Qayta boshlash"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
    <button class="ghost les-only" id="fast" type="button" aria-pressed="false" aria-label="Tezlik 2x">2×</button>
    <button class="ask les-only" id="ask" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      Savol berish
    </button>
  </div>
</div>
<div class="steps les-only"><div class="segs" id="segs" role="img" aria-label="Dars qadamlari"></div><span id="stepLbl"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const svg = $('scene'), ink = $('ink');
  const cap = $('cap'), me = $('me'), askBtn = $('ask');
  let speed = 1, runId = 0, paused = false, interrupting = false;

  // Samarkand tile frieze
  { const f = $('frieze'), c = ['#1e5fa8', '#2fb6c4', '#1e5fa8', '#f1e8d6'];
    for (let x = 0, i = 0; x < 1600; x += 22, i++) {
      const d = document.createElementNS(NS, 'rect');
      d.setAttribute('x', x + 5); d.setAttribute('y', 586); d.setAttribute('width', 12); d.setAttribute('height', 12);
      d.setAttribute('fill', c[i % 4]); d.setAttribute('transform', `rotate(45 ${x + 11} 592)`); f.appendChild(d);
    } }
  // ---------- handwriting ----------
  const G = {
    '0': { w: 60, s: ['M30,2 C10,2 4,30 4,52 C4,78 14,98 30,98 C46,98 56,78 56,50 C56,24 48,2 30,2'] },
    '1': { w: 44, s: ['M10,22 L30,2 L30,98'] },
    '2': { w: 60, s: ['M6,24 C8,8 20,2 30,2 C44,2 54,12 54,26 C54,44 30,62 6,98 L56,98'] },
    '3': { w: 60, s: ['M8,12 C16,3 24,2 32,2 C46,2 54,12 54,24 C54,38 42,46 28,48 C44,48 56,58 56,72 C56,88 44,98 30,98 C20,98 10,94 4,86'] },
    '5': { w: 60, s: ['M52,2 L12,2 L8,44 C16,38 24,36 32,36 C46,36 56,48 56,66 C56,84 44,98 28,98 C18,98 10,94 4,88'] },
    '6': { w: 60, s: ['M50,6 C42,2 36,2 32,2 C14,2 6,30 6,58 C6,82 16,98 32,98 C48,98 56,84 56,70 C56,54 46,44 32,44 C20,44 10,52 6,62'] },
    'x': { w: 56, s: ['M6,42 C20,58 34,80 50,98', 'M50,42 C36,58 20,80 6,98'] },
    '+': { w: 60, s: ['M30,42 L30,90', 'M6,66 L54,66'] },
    '−': { w: 60, s: ['M6,66 L54,66'] },
    '=': { w: 60, s: ['M6,56 L54,56', 'M6,78 L54,78'] },
    '(': { w: 36, s: ['M32,0 C10,24 10,76 32,100'] },
    ')': { w: 36, s: ['M4,0 C26,24 26,76 4,100'] },
    '·': { w: 24, s: ['M12,64 L12.5,68'] },
    'y': { w: 54, s: ['M6,42 L28,90', 'M50,42 L22,112 C18,122 10,122 6,116'] },
    'o': { w: 56, s: ['M28,42 C12,42 6,58 6,70 C6,86 16,98 28,98 C42,98 50,84 50,68 C50,52 42,42 28,42'] },
    'k': { w: 52, s: ['M8,0 L8,98', 'M46,46 L10,76 L48,98'] },
    'i': { w: 26, s: ['M13,44 L13,98', 'M13,20 L13.5,25'] },
    ' ': { w: 30, s: [] }
  };
  const SUP = { '²': '2' };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const el = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };

  async function sleep(ms, id, ch = 'main') {
    let left = ms / speed;
    while (left > 0) {
      if (id !== runId) return;
      const step = Math.min(40, left);
      await new Promise(r => setTimeout(r, step));
      if (!(ch === 'main' && paused)) left -= step;
    }
  }

  function write(str, x, y, size, color) {
    const s = size / 100, out = []; let cx = x;
    for (const ch of str) {
      const sup = SUP[ch], g = G[sup || ch]; if (!g) continue;
      const sc = (sup ? s * .55 : s) * rnd(.96, 1.04);
      const gy = y - 100 * sc - (sup ? size * .55 : 0) + rnd(-2, 2) * s, rot = rnd(-3, 3);
      for (const d of g.s) out.push(el('path', { d, fill: 'none', stroke: color, 'stroke-width': size > 50 ? 5 : 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke', 'data-sc': sc.toFixed(4), transform: `translate(${cx.toFixed(1)},${gy.toFixed(1)}) rotate(${rot.toFixed(2)},${g.w / 2},50) scale(${sc.toFixed(4)})` }));
      cx += (g.w + 10) * (sup ? s * .55 : s);
    }
    out.endX = cx; return out;
  }
  const P = (d, c, w = 4) => el('path', { d, fill: 'none', stroke: c, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  const line = (x1, y1, x2, y2, c, w = 4) => [P(`M${x1},${y1} Q${(x1 + x2) / 2 + rnd(-4, 4)},${(y1 + y2) / 2 + rnd(-4, 4)} ${x2},${y2}`, c, w)];
  function circle(cx, cy, rx, ry, c) {
    let d = '', n = 46, st = rnd(-.6, -.2);
    for (let i = 0; i <= n; i++) { const t = st + i / n * Math.PI * 2.18, j = 1 + Math.sin(i * .7) * .025 + rnd(-.012, .012); d += (i ? ' L' : 'M') + (cx + Math.cos(t) * rx * j).toFixed(1) + ',' + (cy + Math.sin(t) * ry * j * (1 + i / n * .06)).toFixed(1); }
    return [P(d, c)];
  }
  function arrow(x1, y1, x2, y2, bend, c) {
    const mx = (x1 + x2) / 2 + bend, my = (y1 + y2) / 2 - bend * .3, a = Math.atan2(y2 - my, x2 - mx), L = 18;
    return [P(`M${x1},${y1} Q${mx},${my} ${x2},${y2}`, c), P(`M${x2 - L * Math.cos(a - .45)},${y2 - L * Math.sin(a - .45)} L${x2},${y2} L${x2 - L * Math.cos(a + .45)},${y2 - L * Math.sin(a + .45)}`, c)];
  }
  const tick = (x, y, c) => [P(`M${x},${y} L${x + 14},${y + 18} L${x + 44},${y - 26}`, c, 6)];

  // ---------- tutor state ----------
  const T = { sy: 1, x: 280, tx: 280, yaw: -0.38, mode: 'front', want: 'front', tip: null, talk: false, wave: 0 };
  const FLOOR = 860, FRONT_X = 280, FRONT_YAW = -0.38, BACK_YAW = Math.PI;
  const toScene = (p, len) => { const pt = p.getPointAtLength(len), sp = svg.createSVGPoint(); sp.x = pt.x; sp.y = pt.y; return sp.matrixTransform(p.getScreenCTM()).matrixTransform(svg.getScreenCTM().inverse()); };
  function face(mode) { T.want = mode; return new Promise(r => setTimeout(r, 420 / speed)); }

  // ---------- characters (one voxel rig, many configs) ----------
  const XP = 340;

        const p1 = a - th, E = { x: S.x + L1 * Math.cos(p1), y: S.y + L1 * Math.sin(p1) }, p2 = Math.atan2(S.y + dy - E.y, S.x + dx - E.x);
        c.armW.sh.rotation.z = -(p1 + Math.PI / 2); c.armW.el.rotation.z = -(p2 - p1);
      } else { c.armW.sh.rotation.z += (-0.06 - c.armW.sh.rotation.z) * 0.35; c.armW.el.rotation.z += (-0.05 - c.armW.el.rotation.z) * 0.35; }
      if (c.armW.chalk) c.armW.chalk.visible = screen === 'lesson' && T.mode !== 'front';
      animFace(c, now, T.talk && T.mode !== 'back', lis ? 'listen' : T.talk || screen === 'select' ? 'learner' : 'board');

      ren.setScissorTest(false); ren.clear(); ren.render(scene3, cam);
      if (screen === 'select') {
        c.root.visible = false;
        const cr = $('gl').getBoundingClientRect();
        document.querySelectorAll('.card').forEach(el => {
          const id = el.dataset.id, s = SMALL[id], r = el.getBoundingClientRect();
          const k = cr.width / 1600, top = (r.top - cr.top) / k, left = (r.left - cr.left) / k, w = r.width / k;
          s.root.visible = true;
          s.root.scale.set(.5, .5, .5);
          s.root.position.set(left + w / 2, 900 - (top + 352) + (s.hop > now ? Math.sin((s.hop - now) / 500 * Math.PI) * 10 : 0), 0);
          s.body.rotation.y = -0.42 + Math.sin(now / 1600 + left) * 0.05;
          s.armP.sh.rotation.z = 0.08; s.armW.sh.rotation.z = -0.06;
          if (unlocked(s.cfg)) animFace(s, now, false, 'learner');
          ren.setScissorTest(true);
          ren.setScissor(r.left - cr.left, cr.bottom - r.bottom, r.width, r.height);
          ren.render(scene3, cam);
          s.root.visible = false;
        });
        ren.setScissorTest(false);
      }
    }
    const st = screen === 'select' ? 'ustozni tanlang' : lis ? 'tinglamoqda…' : T.mode === 'back' ? 'doskaga yozmoqda' : T.talk ? 'gapirmoqda' : 'kutmoqda';
    if (frame.st !== st) { frame.st = st; $('state').textContent = st; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);


  async function draw(paths, id, ch = 'main', pxs = 520) {
    if (T.want !== 'back') await face('back');
    for (const p of paths) {
      if (id !== runId) return;
      while (ch === 'main' && paused) { await new Promise(r => setTimeout(r, 50)); if (id !== runId) return; }
      ink.appendChild(p);
      const len = p.getTotalLength(), sc = parseFloat(p.dataset.sc || '1');
      const dur = Math.max(70, len * sc / (pxs * speed) * 1000 * rnd(.85, 1.15));
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      T.tip = toScene(p, 0);
      await sleep(T.mode !== 'back' ? 380 : 0, id, ch);
      let el = 0, last = performance.now();
      await new Promise(res => {
        const step = now => {
          if (id !== runId) return res();
          if (!(ch === 'main' && paused)) el += now - last; last = now;
          const k = Math.min(1, el / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          p.style.strokeDashoffset = len * (1 - e);
          if (!(ch === 'main' && paused)) T.tip = toScene(p, len * e);
          k < 1 ? requestAnimationFrame(step) : res();
        };
        requestAnimationFrame(step);
      });
      await sleep(rnd(25, 70), id, ch);
    }
  }
  function say(t) {
    cap.style.opacity = 0;
    setTimeout(() => { cap.textContent = t; cap.style.opacity = 1; }, 180);
    T.talk = true; clearTimeout(say.t);
    say.t = setTimeout(() => T.talk = false, Math.min(4200, 260 + t.length * 52) / speed);
  }
  async function talk(t, id, ch = 'main') { await face('front'); say(t); await sleep(Math.min(4200, 400 + t.length * 52), id, ch); }

  const W = '#f3f0e6', Y = '#f2c94c', O = '#ff9f43', Gr = '#8be28b';
  const STEPS = ['Tenglama', 'Ikki son', "Ko'paytuvchilar", 'Nolga tenglash', 'Javob'];
  const segs = $('segs'); STEPS.forEach(() => { const d = document.createElement('div'); d.className = 'seg'; segs.appendChild(d); });
  function step(i) { [...segs.children].forEach((d, k) => d.className = 'seg' + (k < i ? ' done' : k === i ? ' now' : '')); $('stepLbl').textContent = i < STEPS.length ? `Qadam ${i + 1}/${STEPS.length} · ${STEPS[i]}` : 'Dars tugadi'; }
  let sideDone = false;

  async function lesson() {
    const id = ++runId; paused = false; interrupting = false; sideDone = false;
    ink.replaceChildren(); me.style.display = 'none'; askBtn.disabled = false;
    T.want = 'front'; T.tip = null;
    await sleep(400, id);
    step(0);
    await talk("Salom! Bugun kvadrat tenglamani birga yechamiz.", id);
    say("Mana bizning tenglama.");
    await draw(write('x²−5x+6=0', 60, 110, 72, W), id);
    step(1);
    await talk("Bizga ikkita son kerak: ko'paytmasi 6, yig'indisi minus 5.", id);
    say("Chetda hisoblab olaman…");
    await draw(line(640, 40, 642, 300, 'rgba(243,240,230,.35)', 3), id, 'main', 900);
    await draw(write('(−2)·(−3)=6', 668, 100, 40, Y), id);
    await draw(write('(−2)+(−3)=−5', 668, 170, 40, Y), id);
    await draw(tick(820, 215, Gr), id); sideDone = true;
    step(2); say("Demak, ko'paytuvchilarga ajratamiz…");
    await draw(write('(x+2)', 60, 250, 64, W), id);
    await sleep(500, id);
    await talk("Hmm, to'xta — ishoralarni tekshiramiz. Minus bo'lishi kerak!", id);
    await draw(line(52, 222, 250, 205, O, 5), id, 'main', 700);
    const row = write('(x−2)(x−3)=0', 60, 365, 64, W);
    await draw(row, id);
    await draw(arrow(700, 190, 500, 318, 70, Y), id, 'main', 700);
    step(3);
    await talk("Har bir qavs nolga teng bo'lishi mumkin.", id);
    const a = write('x−2=0', 60, 470, 54, W); await draw(a, id);
    const yk = write('yoki', a.endX + 30, 470, 42, 'rgba(243,240,230,.75)'); await draw(yk, id);
    await draw(write('x−3=0', yk.endX + 30, 470, 54, W), id);
    step(4); say("Javob…");
    const r1 = write('x=2', 120, 580, 64, Y); await draw(r1, id);
    const yk2 = write('yoki', r1.endX + 34, 580, 44, Y); await draw(yk2, id);
    const r2 = write('x=3', yk2.endX + 34, 580, 64, Y); await draw(r2, id);
    await draw(circle((120 + r2.endX) / 2, 552, (r2.endX - 120) / 2 + 40, 50, Y), id, 'main', 650);
    await draw(tick(r2.endX + 64, 548, Gr), id);
    T.tip = null;
    await talk("Javob: x teng 2 yoki x teng 3. Tushunarli bo'ldimi?", id);
    step(5);
    askBtn.disabled = true;
  }

  // ---------- interrupt (barge-in) ----------
  askBtn.addEventListener('click', async () => {
    if (interrupting || askBtn.disabled) return;
    const id = runId; interrupting = true; paused = true; askBtn.disabled = true;
    await face('front');
    say("Ha? Eshitaman…"); T.talk = false;
    await sleep(1300, id, 'q');
    me.textContent = "Nega aynan −2 va −3?"; me.style.display = 'inline-block';
    await sleep(1400, id, 'q');
    await talk("Zo'r savol! Ko'paytmasi 6, yig'indisi −5 bo'lgan sonlar faqat shular. Ko'rsataman.", id, 'q');
    const keepTip = T.tip;
    await draw(write('6=(−2)·(−3)', 680, 340, 34, O), id, 'q');
    await draw(write('−5=(−2)+(−3)', 680, 400, 34, O), id, 'q');
    T.tip = keepTip;
    await talk("Tushunarli? Davom etamiz!", id, 'q');
    me.style.display = 'none';
    interrupting = false; paused = false; askBtn.disabled = false;
    if (keepTip) T.want = 'back';
  });

  // ---------- choose tutor screen ----------
  const grid = $('grid');
  CHARS.forEach(c => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'card' + (unlocked(c) ? '' : ' locked'); b.dataset.id = c.id;
    b.setAttribute('aria-label', unlocked(c) ? `${c.name} — ${c.tag}` : `${c.name}, yopiq: ${lockText(c)}`);
    b.innerHTML = `<span class="lbl"><b>${unlocked(c) || c.need !== 'streak' ? c.name : '???'}</b><i>${unlocked(c) ? c.tag : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> ' + lockText(c)}</i></span><span class="chk" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#241a08" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>`;
    b.addEventListener('click', () => pick(c.id));
    grid.appendChild(b);
  });
  function pick(id) {
    const c = CHARS.find(x => x.id === id), now = performance.now();
    if (!unlocked(c)) { say(c.need === 'streak' ? "Bu maxfiy qahramon. 7 kun ketma-ket o'qisang, ochiladi!" : `${c.name}ni ochish uchun yana ${c.need - XP} XP kerak.`); T.talk = false; if (SMALL[id]) SMALL[id].hop = now + 500; return; }
    selId = id; if (has3D) { cur = BIG[id]; cur.hop = now + 600; SMALL[id].hop = now + 500; }
    T.wave = now + 1500;
    document.querySelectorAll('.card').forEach(el => el.classList.toggle('on', el.dataset.id === id));
    const av = document.querySelector('.ava'); av.style.setProperty('--skin', c.skin); av.style.setProperty('--hair', c.hairStyle === 'hood' ? c.hood : c.hairStyle === 'cap' ? c.cap : c.hair);
    $('selName').textContent = c.name; $('selTag').textContent = c.tag; $('whoName').textContent = c.name.toUpperCase();
    say(c.hi);
  }
  function setScreen(s) {
    screen = s; document.body.dataset.screen = s;
    $('sel').hidden = s !== 'select';
    ink.style.display = s === 'select' ? 'none' : '';
  }
  function toSelect() {
    runId++; paused = false; interrupting = false; T.tip = null; T.want = 'front'; me.style.display = 'none';
    ink.replaceChildren(); setScreen('select'); pick(selId);
  }
  $('start').addEventListener('click', () => { setScreen('lesson'); lesson(); });
  $('hear').addEventListener('click', () => { const c = CHARS.find(x => x.id === selId); T.wave = performance.now() + 1500; say(c.hi); });
  $('tutors').addEventListener('click', toSelect);
  $('replay').addEventListener('click', lesson);
  const fast = $('fast');
  fast.addEventListener('click', () => { speed = speed === 1 ? 2 : 1; fast.setAttribute('aria-pressed', speed === 2); });
  setScreen('select'); pick('blokbek');
})();
</script>
</body>
